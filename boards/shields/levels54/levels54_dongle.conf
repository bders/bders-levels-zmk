# Split central role runs on the dongle
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=y

# Two peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Bluetooth capacity (safe headroom)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Input/pointing on the dongle
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# Prospector adapter options (adjust to taste)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=99

# USB HID only on dongle
CONFIG_ZMK_USB=y

# Keep the dongle awake
CONFIG_ZMK_SLEEP=n