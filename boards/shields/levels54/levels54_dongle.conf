# Number of peripherals (already set in Kconfig, duplicated here for clarity)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Enable input and pointing subsystems
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# Prospector-specific lighting (disable ALS, fix brightness)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=95

# Prevent the dongle from sleeping
CONFIG_ZMK_SLEEP=n