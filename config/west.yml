manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    # ZMK firmware (pin to stable; change to 'main' if you want latest)
    - name: zmk
      remote: zmkfirmware
      revision: v0.2.1
      import: app/west.yml

    # PMW3610 pointing driver
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main

    # Prospector adapter (adds 'prospector_adapter' shield)
    - name: prospector-zmk-module
      remote: carrefinho
      revision: main

  self:
    # Path to your zmk-config repo (keep as 'config' for standard setups)
    path: config

